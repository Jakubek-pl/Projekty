<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kalkulator</title>
        <link rel="shortcut icon" href="Icon.ico" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
       <div class="main-calculator">
            <div class="ekran">
                <p class="ekran-value"></p>
            </div>
            <div class="buttons">
                <button class="jeden" value="1">1</button>
                <button class="dwa" value="2">2</button>
                <button class="trzy" value="3">3</button>
                <button class="plus">+</button>
                <button class="cztery" value="4">4</button>
                <button class="pięć" value="5">5</button>
                <button class="sześć" value="6">6</button>
                <button class="minus">-</button>
                <button class="siedem" value="7">7</button>
                <button class="osiem" value="8">8</button>
                <button class="dziewęć" value="9">9</button>
                <button class="minus-plus">-/+</button>
                <button class="reset">C</button>
                <button class="zero" value="0">0</button>
                <button class="dot">.</button>
                <button class="rowan" style="background-color: #155eb8;">=</button>
            </div>
       </div> 
    </body>
</html>
